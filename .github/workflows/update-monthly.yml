name: Update future Haneda schedules
on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: haneda-monthly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install browser client
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Read published monthly schedules
        run: node monthly.mjs
