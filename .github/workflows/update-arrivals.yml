name: Update Haneda arrivals
on:
  schedule:
    - cron: '15 */2 * * *' # private repository: keep within the free allowance
    - cron: '*/10 * * * *' # public repository: standard runners are free
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: haneda-arrivals
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.private && github.event.schedule == '15 */2 * * *') ||
      (!github.event.repository.private && github.event.schedule == '*/10 * * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install browser client
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Read official arrivals and update the calendar
        run: node scrape.mjs
